name: Build VoidLink IPA

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Release VoidLink IPA
    runs-on: macos-latest

    steps:
      # 克隆上游仓库（保持与上游同步的关键修改）
      - name: Clone Upstream Repository
        run: git clone --branch Integration https://github.com/The-Fried-Fish/VoidLink-previously-moonlight-zwm.git ./external-voidlink

      - name: Checkout submodules
        working-directory: ./external-voidlink
        run: git submodule update --init --recursive

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '5.0'

      - name: Set Build Tag Name
        id: set_tag
        run: |
          DATE=$(date +'%y%m%d-%H%M')
          echo "TAG_NAME=build-$DATE" >> $GITHUB_ENV

      - name: Build VoidLink IPA
        working-directory: ./external-voidlink
        run: |
          xcodebuild -scheme VoidLink -sdk iphoneos -configuration Debug archive -archivePath $PWD/build/VoidLink.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO"
          mkdir -p ./build/IPA/Payload
          cp -r ./build/VoidLink.xcarchive/Products/Applications/VoidLink.app ./build/IPA/Payload/VoidLink.app
          cd ./build/IPA && zip -r ../../build/VoidLink.ipa ./Payload/* && cd ../..

      - name: Verify Artifacts
        working-directory: ./external-voidlink
        run: |
          if [ ! -f ./build/VoidLink.ipa ]; then
            echo "::error::VoidLink.ipa not found!"
            exit 1
          fi
          echo "IPA built successfully"

      - name: Auto Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ env.TAG_NAME }}
          prerelease: false
          files: ./external-voidlink/build/VoidLink.ipa
